services:
  # ============================================================================
  # 1. Base de Données PostgreSQL 16 + Extension PostGIS 3.4 (Production)
  # ============================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: uac_buspass_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uac_buspass_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uac_buspass_prod_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-uac_buspass_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uac_buspass_user} -d ${POSTGRES_DB:-uac_buspass_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Redis 7 (Cache, WebSockets PubSub & Celery Message Broker)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: uac_buspass_redis_prod
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. API Backend FastAPI & WebSockets (Serveur Gunicorn Multi-Workers)
  # ============================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: uac_buspass_api_prod
    restart: unless-stopped
    command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:8000 --timeout 120 --access-logfile - --error-logfile -
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - APP_ENV=production
      - DEBUG=False
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-uac_buspass_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-uac_buspass_prod_password_2026}
      - POSTGRES_DB=${POSTGRES_DB:-uac_buspass_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-uac_buspass_user}:${POSTGRES_PASSWORD:-uac_buspass_prod_password_2026}@postgres:5432/${POSTGRES_DB:-uac_buspass_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-uac_buspass_user}:${POSTGRES_PASSWORD:-uac_buspass_prod_password_2026}@postgres:5432/${POSTGRES_DB:-uac_buspass_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - AUTO_SEED=false
    volumes:
      - uploads_data_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 4. Celery Worker (Workers asynchrones distribués)
  # ============================================================================
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: uac_buspass_celery_worker_prod
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker --concurrency=4 --loglevel=info
    env_file:
      - ../.env
    environment:
      - APP_ENV=production
      - DEBUG=False
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-uac_buspass_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-uac_buspass_prod_password_2026}
      - POSTGRES_DB=${POSTGRES_DB:-uac_buspass_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-uac_buspass_user}:${POSTGRES_PASSWORD:-uac_buspass_prod_password_2026}@postgres:5432/${POSTGRES_DB:-uac_buspass_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - AUTO_SEED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 5. Celery Beat (Planificateur périodique)
  # ============================================================================
  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: uac_buspass_celery_beat_prod
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    env_file:
      - ../.env
    environment:
      - APP_ENV=production
      - DEBUG=False
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-uac_buspass_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-uac_buspass_prod_password_2026}
      - POSTGRES_DB=${POSTGRES_DB:-uac_buspass_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-uac_buspass_user}:${POSTGRES_PASSWORD:-uac_buspass_prod_password_2026}@postgres:5432/${POSTGRES_DB:-uac_buspass_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - AUTO_SEED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data_prod:
  redis_data_prod:
  uploads_data_prod:

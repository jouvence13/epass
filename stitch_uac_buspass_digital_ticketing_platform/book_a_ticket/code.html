<body class="bg-background text-on-background min-h-screen pb-[90px]">
<!-- TopAppBar -->
<header class="bg-surface shadow-sm fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin py-sm">

</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container transition-colors rounded-full p-2 cursor-pointer">notifications</span>
<img class="w-8 h-8 rounded-full object-cover" data-alt="A small circular avatar of a university student looking professional but casual, suitable for an academic transport application. The style is modern, well-lit, and highly realistic, fitting within a light-mode UI context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7rb_K6eP2IgpuKNb34H_URfJkFXed6veGRqfLSxp8Ts-xw8AkR6R4kyYTOu4TnGY_gxr1WbbMNX79N6oB3XJFanxl5G2B3KpD0a-LE-uVMeRuhqGeU2vmLb4rWe0FMG0h76f2HcIcRe03d_KJdpgI1N8M3U6_md0bwqPTEsdWmQIr83XB6V7iUZOwc9-_KUk0TG1J-yEFp6OJYqYW7K0GOsWh63aiTn5bD8JtNcVdrHKy2sHV3Qr6Og"/>

<main class="pt-[72px] px-container-margin max-w-[1200px] mx-auto">
<div class="mb-lg mt-md">
<h2 class="font-headline-md text-headline-md text-primary">Booking</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Réservez votre trajet universitaire.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Left Column: Route & Time Selection -->
<div class="flex flex-col gap-md">
<!-- Route Selection -->
<div class="bg-surface-container-lowest p-md rounded-xl shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
<h3 class="font-label-caps text-label-caps text-outline mb-sm uppercase">Trajet</h3>
<div class="flex flex-col gap-sm relative">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">trip_origin</span>
<select class="w-full bg-surface border border-outline-variant rounded-lg p-sm font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none">
<option>Calavi Campus</option>
<option>Cotonou Centre</option>
<option>Porto-Novo</option>
</select>
</div>
<div class="absolute left-[11px] top-[32px] bottom-[32px] w-[2px] bg-outline-variant"></div>
<div class="flex items-center gap-sm mt-xs">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">location_on</span>
<select class="w-full bg-surface border border-outline-variant rounded-lg p-sm font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none">
<option>Cotonou Centre</option>
<option>Calavi Campus</option>
<option>Porto-Novo</option>
</select>
</div>
</div>
</div>
<!-- Time Slot & Capacity -->
<div class="bg-surface-container-lowest p-md rounded-xl shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
<h3 class="font-label-caps text-label-caps text-outline mb-sm uppercase">Horaires Disponibles (Aujourd'hui)</h3>
<div class="flex flex-col gap-sm">
<!-- Slot 1 (Available) -->
<label class="flex items-center justify-between p-sm border border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors">
<div class="flex items-center gap-md">
<input checked="" class="text-primary focus:ring-primary h-5 w-5 border-outline-variant" name="time_slot" type="radio"/>
<div>
<span class="block font-body-lg text-body-lg font-semibold">07:30 - Ligne A</span>
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">groups</span>
                                        32/50 places
                                    </span>
</div>
</div>
<span class="bg-secondary-container text-on-secondary-container font-label-caps text-label-caps px-2 py-1 rounded-full">Disponible</span>
</label>
<!-- Slot 2 (Full) -->
<label class="flex items-center justify-between p-sm border border-outline-variant rounded-lg bg-surface-dim opacity-70 cursor-not-allowed">
<div class="flex items-center gap-md">
<input class="text-primary focus:ring-primary h-5 w-5 border-outline-variant" disabled="" name="time_slot" type="radio"/>
<div>
<span class="block font-body-lg text-body-lg font-semibold text-on-surface-variant">08:15 - Ligne B</span>
<span class="font-body-md text-body-md text-error flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">person_off</span>
                                        50/50 places
                                    </span>
</div>
</div>
<span class="bg-error-container text-on-error-container font-label-caps text-label-caps px-2 py-1 rounded-full">Complet</span>
</label>
</div>
</div>
</div>

<div class="flex flex-col gap-md">
<!-- Payment Method -->
<div class="bg-surface-container-lowest p-md rounded-xl shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
<h3 class="font-label-caps text-label-caps text-outline mb-sm uppercase">Mode de Paiement</h3>
<div class="flex flex-col gap-sm">
<!-- MTN MoMo -->
<label class="flex items-center gap-md p-sm border border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors h-[64px]">
<input checked="" class="text-primary focus:ring-primary h-5 w-5 border-outline-variant" name="payment_method" type="radio"/>
<div class="w-12 h-12 bg-[#FFCC00] rounded-lg flex items-center justify-center font-bold text-black shadow-sm">
                                MTN
                            </div>
<div class="flex-1">
<span class="block font-body-lg text-body-lg font-semibold">MTN Mobile Money</span>
<span class="font-body-md text-body-md text-on-surface-variant">Frais: 0F</span>
</div>
</label>
<!-- Moov Money -->
<label class="flex items-center gap-md p-sm border border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors h-[64px]">
<input class="text-primary focus:ring-primary h-5 w-5 border-outline-variant" name="payment_method" type="radio"/>
<div class="w-12 h-12 bg-[#0055A5] rounded-lg flex items-center justify-center font-bold text-white shadow-sm">
                                Moov
                            </div>
<div class="flex-1">
<span class="block font-body-lg text-body-lg font-semibold">Moov Money</span>
<span class="font-body-md text-body-md text-on-surface-variant">Frais: 0F</span>
</div>
</label>
</div>
<div class="mt-sm">
<label class="block font-label-caps text-label-caps text-outline mb-xs">Numéro de paiement</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg p-sm font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="Ex: 97000000" type="tel"/>
</div>
</div>
<!-- Action -->
<div class="mt-auto">
<button class="w-full bg-tertiary-fixed-dim text-on-tertiary-fixed-variant font-headline-md text-headline-md py-md rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.12)] flex justify-between items-center px-lg hover:opacity-90 transition-opacity">
<span>Payer &amp; Réserver</span>
<span class="font-bold">250 FCFA</span>
</button>
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-sm">Un SMS de confirmation vous sera envoyé.</p>
</div>
</div>

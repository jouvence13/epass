<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased pb-[80px]"> <!-- Added pb for BottomNavBar -->
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin py-sm bg-surface shadow-sm">
<div class="flex items-center gap-sm">
<img class="w-10 h-10 rounded-full object-cover" data-alt="A small, professional portrait photo of a university student used as a profile avatar, brightly lit with a clean background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAVmvsiE3PIz1hNZbTibN5PLxeoaMPoUZn2LILcBFQDuzhkBFSqrDnL6KtRKcQ9-5V7HjqDmhkZ4kOe3ZaivM2uabALGhUEQkFuOKFp8yV-SyoE34Ehml13XiIK6euEZ9r76L-rq6E-lD2Vo64TDXSqq_Iq3r92nLaS6BMfvFgZdL0ubnpXqcsnfuV-svgv9h1k0ykeM8qG7rgQ_qiR3Tcx-P-8RS2cYYT-I9I7M9NrZVbW50aZ0pPLnw"/>
<h1 class="text-headline-sm font-headline-sm font-bold text-primary">CROUS-UAC</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:bg-surface-container transition-colors focus:outline-none">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-[72px] px-container-margin pb-xl max-w-[1200px] mx-auto grid grid-cols-1 md:grid-cols-12 gap-lg">
<!-- Left Column: Ticket & Status -->
<div class="md:col-span-5 flex flex-col gap-lg">
<!-- Driver Alert Notification -->
<div class="bg-error-container text-on-error-container p-md rounded-lg flex items-start gap-sm shadow-sm">
<span class="material-symbols-outlined mt-1" style="font-variation-settings: 'FILL' 1;">warning</span>
<div>
<h3 class="font-headline-sm text-headline-sm">Delay: +15 min</h3>
<p class="font-body-md text-body-md opacity-90">Due to heavy traffic near the central campus roundabout.</p>
</div>
</div>
<!-- QR Code Ticket Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg flex flex-col items-center text-center relative shadow-[0px_4px_12px_rgba(0,0,0,0.12)] border-t-4 border-primary">
<!-- Status Badge -->
<div class="absolute -top-4 bg-secondary text-on-secondary px-md py-sm rounded-full flex items-center gap-xs shadow-md">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-caps text-label-caps">Valid Ticket</span>
</div>
<h2 class="font-headline-md text-headline-md text-primary mt-sm">Campus Express Route 4</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">Student ID: 2023-4458</p>
<!-- Dynamic QR Area -->
<div class="relative w-[220px] h-[220px] bg-white p-md rounded-lg shadow-inner flex items-center justify-center mb-md border border-surface-variant">
<!-- Placeholder for dynamic QR code -->
<img class="w-[180px] h-[180px] object-contain" data-alt="A high-contrast black and white QR code centered on a crisp white square background, representing a secure digital boarding pass." src="https://lh3.googleusercontent.com/aida-public/AB6AXuADjh8bqwkx4X5g-Bjm7QxWF6Au782wnOblNFoc9IL5IN2CLs1SRaVnAXgxsSkU3HdLhUeDq6miYq5NUmiOB_vlcGm-XaZvsNYzMIGHUYY8wzqE-HxOVKhk36u6wQ4mrCVIP1KCOnHIxGy6ZDBD-wq-1WtWLzJA-P7s1Q8-UCKZG8APexoyNDSg8NCUQR4MX9hYcSC8T2zFk6aew3XTMQT9vNLp-MGR4IQRR4NPkMOydlX7zxHAXxjNyw"/>
<!-- Security Pulse -->
<div class="absolute inset-0 border-2 border-secondary rounded-lg pulse-ring pointer-events-none"></div>
</div>
<div class="font-status-code text-status-code text-primary-container tracking-widest bg-surface-container px-md py-sm rounded-md w-full mb-lg">
                    A7B9-X2M4
                </div>
<!-- Recycle Action -->
<button class="w-full bg-surface-variant text-primary font-headline-sm text-headline-sm py-md rounded-lg flex items-center justify-center gap-sm hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined">recycling</span>
                    Recycle Ticket
                </button>
<p class="font-label-caps text-label-caps text-outline mt-sm">Available for 6 more days</p>
</div>
</div>
<!-- Right Column: Real-time Tracking -->
<div class="md:col-span-7 flex flex-col gap-lg h-full">
<div class="bg-surface-container-lowest rounded-xl shadow-sm flex flex-col h-full min-h-[500px] overflow-hidden">
<!-- Map Header Info -->
<div class="p-lg bg-surface-container-low border-b border-surface-variant flex justify-between items-center">
<div>
<h3 class="font-headline-sm text-headline-sm text-primary">Live Tracking</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Bus #402 • Capacity: 65%</p>
</div>
<div class="text-right">
<div class="font-display-lg text-display-lg text-secondary">8 min</div>
<p class="font-label-caps text-label-caps text-outline">Estimated Arrival</p>
</div>
</div>
<!-- Map View Area -->
<div class="flex-grow relative bg-surface-variant relative overflow-hidden">
<!-- Map Placeholder -->
<img class="w-full h-full object-cover" data-alt="A clean, modern digital map interface displaying city streets in light mode, with a clear route marked in bright blue. A distinct marker indicates a bus location." data-location="Abomey-Calavi" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBkojL6MpkYD2BVCQnuTVgnTpRMolWBzIUNzsEklHnBCmK8m_86vpyQc_8h1PuYEYbvBYscciF6-SH6QSC0Ov-AABJPcBF-tIgY8GduTJ8fkqINn758Dl3nJDgrCQgErAPtnfC2kq7cm5AugIv0w8vhFW_9dFAJ1cRjWHqohtxT_bHMpl5ThiQPvXizGyn6Vd49rnRubTw2GTia7XSTAPHU6YXN4DUg9Djpc5ytBtKhLBpRBJOjgsgiVg"/>

<div class="absolute top-[40%] left-[60%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-primary text-on-primary w-12 h-12 rounded-full flex items-center justify-center shadow-lg relative z-10">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
<!-- Directional Arrow -->
<div class="absolute -top-1 -right-1 bg-surface text-primary rounded-full w-5 h-5 flex items-center justify-center shadow-sm transform rotate-45">
<span class="material-symbols-outlined text-[12px]">navigation</span>
</div>
</div>
<!-- Live Dot -->
<div class="w-3 h-3 bg-secondary rounded-full mt-2 animate-pulse shadow-[0_0_8px_rgba(27,109,36,0.8)]"></div>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Hidden on md and up) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-sm pb-gutter pt-sm bg-surface border-t border-outline-variant shadow-lg rounded-t-xl md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined mb-1 text-[24px]">directions_bus</span>
<span class="font-label-caps text-label-caps">Home</span>
</button>
<!-- Active Tab: Tickets -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 scale-90 duration-200 ease-in-out focus:outline-none">
<span class="material-symbols-outlined mb-1 text-[24px]" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
<span class="font-label-caps text-label-caps">Tickets</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined mb-1 text-[24px]">add_circle</span>
<span class="font-label-caps text-label-caps">Booking</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined mb-1 text-[24px]">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</button>
</nav>

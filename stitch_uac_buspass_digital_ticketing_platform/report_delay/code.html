<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Incident &amp; Delay Report - CROUS-UAC Driver</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-background": "#191c1d",
                      "inverse-primary": "#a7c8ff",
                      "surface-container": "#edeeef",
                      "on-tertiary-fixed": "#281900",
                      "on-primary": "#ffffff",
                      "on-primary-fixed": "#001b3c",
                      "primary-fixed-dim": "#a7c8ff",
                      "on-tertiary-container": "#ce9000",
                      "primary-fixed": "#d5e3ff",
                      "on-surface-variant": "#43474f",
                      "tertiary-fixed": "#ffdeac",
                      "background": "#f8f9fa",
                      "error-container": "#ffdad6",
                      "inverse-surface": "#2e3132",
                      "secondary-fixed": "#a3f69c",
                      "on-secondary": "#ffffff",
                      "outline-variant": "#c3c6d1",
                      "error": "#ba1a1a",
                      "surface-container-high": "#e7e8e9",
                      "on-primary-container": "#799dd6",
                      "on-tertiary-fixed-variant": "#604100",
                      "surface-variant": "#e1e3e4",
                      "secondary-fixed-dim": "#88d982",
                      "on-tertiary": "#ffffff",
                      "surface-dim": "#d9dadb",
                      "on-error-container": "#93000a",
                      "surface-tint": "#3a5f94",
                      "on-secondary-container": "#217128",
                      "outline": "#737780",
                      "inverse-on-surface": "#f0f1f2",
                      "surface-container-highest": "#e1e3e4",
                      "on-primary-fixed-variant": "#1f477b",
                      "surface-container-lowest": "#ffffff",
                      "primary": "#001e40",
                      "on-secondary-fixed": "#002204",
                      "on-secondary-fixed-variant": "#005312",
                      "surface-container-low": "#f3f4f5",
                      "tertiary-fixed-dim": "#ffba38",
                      "on-surface": "#191c1d",
                      "secondary-container": "#a0f399",
                      "tertiary-container": "#472f00",
                      "surface": "#f8f9fa",
                      "secondary": "#1b6d24",
                      "on-error": "#ffffff",
                      "tertiary": "#2b1b00",
                      "surface-bright": "#f8f9fa",
                      "primary-container": "#003366"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xs": "4px",
                      "sm": "8px",
                      "lg": "24px",
                      "xl": "32px",
                      "gutter": "12px",
                      "container-margin": "16px",
                      "md": "16px",
                      "base": "4px"
              },
              "fontFamily": {
                      "display-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "status-code": ["Inter"],
                      "headline-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-caps": ["Inter"],
                      "headline-sm": ["Inter"]
              },
              "fontSize": {
                      "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "status-code": ["18px", {"lineHeight": "24px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom radio button styles for cards */
        input[type="radio"]:checked + div {
            border-color: #001e40; /* primary */
            background-color: #d5e3ff; /* primary-fixed */
        }
        input[type="radio"]:checked + div .icon-container {
            background-color: #001e40;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col pt-14 pb-20">
<!-- TopAppBar (Transactional - Nav hidden, Back action shown instead of drawer) -->
<header class="fixed top-0 w-full bg-primary text-on-primary font-headline-sm text-headline-sm shadow-md flex justify-between items-center px-container-margin h-14 z-50 transition-transform active:scale-95">
<div class="flex items-center gap-sm">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-white/10 transition-colors" onclick="history.back()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-bold text-on-primary font-headline-sm text-headline-sm">Report Delay</span>
</div>
<div class="flex items-center">
<!-- Trailing action adapted for contextual need -->
<button class="font-label-caps text-label-caps bg-error text-on-error px-3 py-1 rounded-full flex items-center gap-1 hover:opacity-90">
<span class="material-symbols-outlined text-[16px]">warning</span>
                EMERGENCY
            </button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow px-container-margin py-lg max-w-[1200px] mx-auto w-full grid grid-cols-1 md:grid-cols-4 gap-lg">
<!-- Context Banner -->
<div class="md:col-span-4 bg-tertiary-fixed text-on-tertiary-fixed rounded-xl p-md flex items-start gap-md shadow-[0px_2px_8px_rgba(0,0,0,0.05)] border border-tertiary-fixed-dim/30">
<span class="material-symbols-outlined text-[32px] filled text-on-tertiary-fixed-variant mt-1">campaign</span>
<div>
<h2 class="font-headline-sm text-headline-sm text-on-tertiary-fixed-variant mb-1">Instant Notification</h2>
<p class="font-body-md text-body-md opacity-90">Selecting an option below will instantly notify all <strong>50 passengers</strong> currently tracking Route 42. Please report accurately.</p>
</div>
</div>
<!-- Left Column: Delay Duration -->
<div class="md:col-span-2 space-y-md">
<h3 class="font-headline-md text-headline-md text-primary flex items-center gap-sm">
<span class="material-symbols-outlined">schedule</span>
                Estimated Delay
            </h3>
<div class="grid grid-cols-3 gap-sm">
<label class="cursor-pointer">
<input class="peer sr-only" name="delay_time" type="radio" value="15"/>
<div class="h-16 rounded-xl border-2 border-outline-variant bg-surface flex flex-col items-center justify-center transition-all peer-hover:border-primary peer-active:scale-95 shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
<span class="font-headline-sm text-headline-sm font-bold text-primary">+15</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">MIN</span>
</div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="delay_time" type="radio" value="30"/>
<div class="h-16 rounded-xl border-2 border-primary bg-primary-fixed flex flex-col items-center justify-center transition-all peer-hover:border-primary peer-active:scale-95 shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
<span class="font-headline-sm text-headline-sm font-bold text-primary">+30</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">MIN</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="delay_time" type="radio" value="45"/>
<div class="h-16 rounded-xl border-2 border-outline-variant bg-surface flex flex-col items-center justify-center transition-all peer-hover:border-primary peer-active:scale-95 shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
<span class="font-headline-sm text-headline-sm font-bold text-primary">+45</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">MIN</span>
</div>
</label>
</div>
<div class="mt-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-xs block">Custom Delay (Minutes)</label>
<input class="w-full h-[48px] rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-surface px-md font-body-lg text-body-lg transition-colors" placeholder="e.g. 60" type="number"/>
</div>
</div>
<!-- Right Column: Incident Type -->
<div class="md:col-span-2 space-y-md">
<h3 class="font-headline-md text-headline-md text-primary flex items-center gap-sm">
<span class="material-symbols-outlined">report</span>
                Incident Type
            </h3>
<div class="grid grid-cols-1 gap-sm">
<label class="cursor-pointer">
<input class="peer sr-only" name="incident_type" type="radio" value="traffic"/>
<div class="min-h-[64px] rounded-xl border-2 border-outline-variant bg-surface flex items-center p-md transition-all peer-hover:border-primary peer-active:scale-95 shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
<div class="icon-container w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center mr-md transition-colors text-on-surface-variant">
<span class="material-symbols-outlined filled">traffic</span>
</div>
<div class="flex-grow">
<h4 class="font-headline-sm text-headline-sm">Heavy Traffic</h4>
</div>
</div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="incident_type" type="radio" value="mechanical"/>
<div class="min-h-[64px] rounded-xl border-2 border-primary bg-primary-fixed flex items-center p-md transition-all peer-hover:border-primary peer-active:scale-95 shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
<div class="icon-container w-10 h-10 rounded-full bg-primary flex items-center justify-center mr-md transition-colors text-on-primary">
<span class="material-symbols-outlined filled">build</span>
</div>
<div class="flex-grow">
<h4 class="font-headline-sm text-headline-sm text-primary">Mechanical Issue</h4>
</div>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="incident_type" type="radio" value="roadblock"/>
<div class="min-h-[64px] rounded-xl border-2 border-outline-variant bg-surface flex items-center p-md transition-all peer-hover:border-primary peer-active:scale-95 shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
<div class="icon-container w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center mr-md transition-colors text-on-surface-variant">
<span class="material-symbols-outlined filled">block</span>
</div>
<div class="flex-grow">
<h4 class="font-headline-sm text-headline-sm">Roadblock / Detour</h4>
</div>
</div>
</label>
</div>
</div>
<!-- Action Area -->
<div class="md:col-span-4 mt-lg pt-lg border-t border-outline-variant/30 flex flex-col md:flex-row gap-md justify-end">
<button class="h-[48px] px-lg rounded-full font-headline-sm text-headline-sm text-primary border border-primary hover:bg-primary-fixed transition-colors flex items-center justify-center shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
                Cancel
            </button>
<button class="h-[48px] px-xl rounded-full font-headline-sm text-headline-sm bg-tertiary-fixed-dim text-on-tertiary-container hover:opacity-90 transition-all flex items-center justify-center gap-sm shadow-[0px_4px_12px_rgba(0,0,0,0.12)] active:scale-95" onclick="showProcessingOverlay()">
<span class="material-symbols-outlined filled">send</span>
                Broadcast Delay
            </button>
</div>
</main>
<!-- Processing Overlay (Hidden by default) -->
<div class="fixed inset-0 bg-on-background/80 z-[100] hidden flex-col items-center justify-center" id="processing-overlay">
<div class="bg-surface rounded-xl p-xl max-w-sm w-full mx-4 flex flex-col items-center shadow-xl">
<div class="w-16 h-16 border-4 border-surface-variant border-t-secondary rounded-full animate-spin mb-lg"></div>
<h3 class="font-headline-md text-headline-md text-primary mb-sm">Broadcasting...</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Notifying 50 passengers tracking Route 42.</p>
</div>
</div>
<!-- Navigation suppressed because this is a transactional/task-focused screen -->
<script>
        function showProcessingOverlay() {
            const overlay = document.getElementById('processing-overlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            
            // Simulate network request
            setTimeout(() => {
                overlay.classList.remove('flex');
                overlay.classList.add('hidden');
                // Could redirect or show success toast here
                alert('Incident broadcasted successfully.');
                history.back();
            }, 2000);
        }
    </script>
</body></html>
